name: banking-airflow
services:
  airflow-db:
    image: postgres:16
    environment:
      POSTGRES_DB: airflow
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: ${AIRFLOW_DB_PASSWORD:?Copy .env.airflow.example to .env.airflow}
    volumes:
      - airflow-db:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U airflow -d airflow"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  banking-db:
    image: postgres:18
    environment:
      POSTGRES_DB: banking_dwh
      POSTGRES_USER: banking
      POSTGRES_PASSWORD: ${BANKING_DB_PASSWORD:?Copy .env.airflow.example to .env.airflow}
    volumes:
      - banking-db:/var/lib/postgresql
      - ./sql/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U banking -d banking_dwh"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  airflow:
    build:
      context: .
      dockerfile: Dockerfile.airflow
    command: standalone
    environment:
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "true"
      AIRFLOW__CORE__SIMPLE_AUTH_MANAGER_USERS: "admin:admin"
      AIRFLOW__CORE__SIMPLE_AUTH_MANAGER_PASSWORDS_FILE: /opt/airflow/auth/passwords.json
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:${AIRFLOW_DB_PASSWORD}@airflow-db:5432/airflow
      DB_HOST: banking-db
      DB_PORT: "5432"
      DB_NAME: banking_dwh
      DB_USER: banking
      DB_PASSWORD: ${BANKING_DB_PASSWORD}
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - banking-data:/opt/banking/data
      - banking-logs:/opt/banking/logs
      - airflow-logs:/opt/airflow/logs
      - airflow-auth:/opt/airflow/auth
    depends_on:
      airflow-db:
        condition: service_healthy
      banking-db:
        condition: service_healthy
    restart: unless-stopped
    stop_grace_period: 30s

volumes:
  airflow-db:
  banking-db:
  banking-data:
  banking-logs:
  airflow-logs:
  airflow-auth:
